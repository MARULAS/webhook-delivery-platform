services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
      POSTGRES_DB: webhooks
    ports:
      # Published on 5433 so the container does not collide with a PostgreSQL
      # server already listening on the host's default 5432. Inside the
      # container PostgreSQL still listens on 5432; only the host port differs,
      # so DATABASE_URL must use 5433.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
